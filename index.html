<style>
:root{
  --sea:#0B8A96; --sea-deep:#086a74; --sand:#FCF1DE; --sand-2:#F6E2BF; --ink:#173238; --muted:#4F6668; --line:#EFE1C8; --white:#FFFCF5; --sun:#F6B04A; --coral:#E8694A; --ocean:#0A3F47;
  --serif:"Cormorant Garamond", Georgia, serif; --sans:"Manrope", system-ui, sans-serif;
  --pad:clamp(20px,5vw,64px); --max:1180px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{font-family:var(--sans);color:var(--ink);background:var(--white);font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased}
img{display:block;max-width:100%}
a{color:var(--sea);text-decoration:none}
a:hover{color:var(--sea-deep)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--serif);font-weight:500;line-height:1.08;letter-spacing:-.01em;text-wrap:balance}
p{text-wrap:pretty}
.wrap{max-width:var(--max);margin:0 auto;padding:0 var(--pad)}
section{padding:clamp(72px,11vw,140px) 0}
.kicker{font-size:12px;letter-spacing:.18em;text-transform:uppercase;font-weight:700;color:var(--coral);margin-bottom:14px;display:flex;align-items:center;gap:10px}
.kicker::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--sun);flex:none}
.h2{font-size:clamp(36px,6vw,58px);margin-bottom:20px}
.lead{color:var(--muted);font-size:17px;max-width:560px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 28px;border-radius:999px;border:1px solid transparent;font-weight:600;font-size:15px;letter-spacing:.02em;cursor:pointer;transition:background .25s,color .25s,border-color .25s,transform .25s}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--sea);color:#fff}
.btn-primary:hover{background:var(--sea-deep);color:#fff}
.btn-light{background:var(--sun);color:var(--ocean)}
.btn-light:hover{background:#ffc164;color:var(--ocean)}
.btn-ghost{border-color:var(--line);background:transparent;color:var(--ink)}
.btn-ghost:hover{border-color:var(--sea);color:var(--sea)}
.btn-wa{background:#1F8F5F;color:#fff}
.btn-wa:hover{background:#18764e;color:#fff}
.btn svg{width:20px;height:20px}

/* reveal */
.rv{opacity:1}
.rv.in{filter:none}
@keyframes blurIn{from{opacity:0;filter:blur(16px);transform:translateY(18px)}to{opacity:1;filter:none;transform:none}}
.hero-in > div > *{opacity:1}
.hero-in > div > :nth-child(1){animation-delay:.2s}.hero-in > div > :nth-child(2){animation-delay:.4s}.hero-in > div > :nth-child(3){animation-delay:.65s}.hero-in > div > :nth-child(4){animation-delay:.85s}
.marq{background:var(--ocean);color:#fff;overflow:hidden;padding:18px 0;white-space:nowrap}
.marq-t{display:inline-flex;gap:28px;align-items:center;animation:marq 38s linear infinite;font-family:var(--serif);font-size:clamp(20px,2.4vw,28px)}
.marq-t span:nth-child(4n+3){font-style:italic;color:var(--sun)}
.marq-t i{width:6px;height:6px;border-radius:50%;background:var(--sun);flex:none}
@keyframes marq{to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.rv{filter:none}.hero-in > div > *{opacity:1;animation:none}.marq-t{animation:none}}
.rv.split{opacity:1;transform:none}
.sw{display:inline-block;overflow:hidden;vertical-align:top;padding:0 .04em .12em;margin:0 -.04em -.12em}
.sw > span{display:inline-block;transform:translateY(110%) rotate(4deg);transform-origin:0 100%;transition:transform 1.1s cubic-bezier(.2,.8,.2,1)}
.split.in .sw > span{transform:none}
.scrub .sw > span{transition:transform .12s linear}
.fw{transition:opacity .12s linear}
.rv-img.scrubbed{transition:opacity .9s ease}
.rv-img.scrubbed img{transition:none}
@media (prefers-reduced-motion:reduce){.sw > span{transform:none;transition:none}}

.rv.in{opacity:1;transform:none}
.prog{position:fixed;top:0;left:0;height:3px;width:100%;transform-origin:0 50%;transform:scaleX(0);background:var(--sun);z-index:70;pointer-events:none}
@media (prefers-reduced-motion:reduce){.rv,.rv-img,.rv-img img{opacity:1;transform:none;transition:none;clip-path:none}html{scroll-behavior:auto}}

/* header */
header{position:fixed;inset:0 0 auto 0;z-index:50;transition:background .35s,box-shadow .35s,color .35s;color:#fff}
header.solid{background:rgba(255,252,245,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);color:var(--ink);box-shadow:0 1px 0 var(--line),0 10px 30px -20px rgba(10,63,71,.35)}
header.mopen{color:#fff;background:transparent;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none}
.hbar{display:grid;grid-template-columns:1fr auto;align-items:center;gap:20px;height:76px;transition:height .35s}
header.solid .hbar{height:64px}
.logo{display:flex;flex-direction:column;line-height:1;font-family:var(--serif);font-size:25px;font-weight:600;color:inherit;letter-spacing:.01em}
.logo:hover{color:inherit}
.logo small{font-family:var(--sans);font-size:9.5px;letter-spacing:.3em;text-transform:uppercase;font-weight:600;opacity:.75;margin-top:6px}
nav.links{display:none;gap:34px;font-size:13px;font-weight:600;letter-spacing:.05em}
nav.links a{position:relative;color:inherit;padding:8px 0;opacity:.88;transition:opacity .25s}
nav.links a:hover,nav.links a.act{opacity:1;color:inherit}
nav.links a::after{content:"";position:absolute;left:0;right:0;bottom:2px;height:1.5px;background:var(--sun);transform:scaleX(0);transform-origin:left;transition:transform .35s cubic-bezier(.2,.7,.2,1)}
nav.links a:hover::after,nav.links a.act::after{transform:scaleX(1)}
.hright{display:flex;align-items:center;gap:12px;justify-self:end}
.lang{display:flex;gap:2px;border:1px solid rgba(255,255,255,.45);border-radius:999px;padding:3px}
header.solid:not(.mopen) .lang{border-color:var(--line)}
.lang button{border:0;background:transparent;color:inherit;font-size:11px;font-weight:700;letter-spacing:.08em;padding:6px 9px;border-radius:999px;cursor:pointer;min-width:34px;transition:background .25s,color .25s}
.lang button.on{background:#fff;color:var(--ocean)}
header.solid:not(.mopen) .lang button.on{background:var(--sea);color:#fff}
.hbook{display:none;min-height:44px;padding:0 22px;font-size:13px;letter-spacing:.04em}
.menu{width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.45);background:transparent;color:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px}
header.solid:not(.mopen) .menu{border-color:var(--line)}
.menu i{display:block;width:18px;height:1.5px;background:currentColor;border-radius:2px;transition:transform .35s}
header.mopen .menu i:first-child{transform:translateY(3.25px) rotate(45deg)}
header.mopen .menu i:last-child{transform:translateY(-3.25px) rotate(-45deg)}
.mnav{position:fixed;inset:0;z-index:-1;background:var(--ocean);display:flex;flex-direction:column;justify-content:center;gap:4px;padding:96px var(--pad) calc(40px + env(safe-area-inset-bottom));opacity:0;pointer-events:none;transition:opacity .4s}
.mnav.open{opacity:1;pointer-events:auto}
.mnav a{font-family:var(--serif);font-size:clamp(34px,9vw,48px);line-height:1.2;color:#fff;opacity:0;transform:translateY(14px);transition:opacity .5s,transform .5s cubic-bezier(.2,.7,.2,1)}
.mnav a:hover{color:var(--sun)}
.mnav.open a{opacity:1;transform:none}
.mnav .btn{margin-top:28px;align-self:flex-start;font-family:var(--sans);font-size:15px;line-height:1}
@media (min-width:1080px){
  .hbar{grid-template-columns:1fr auto 1fr}
  nav.links{display:flex}
  .hbook{display:inline-flex}
  .menu,.mnav{display:none}
}

/* hero */
.hero{position:relative;min-height:100svh;display:flex;align-items:flex-end;color:#fff;padding:110px 0 0;overflow:hidden;background:var(--ocean)}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 55%;filter:saturate(1.28) contrast(1.08) brightness(1.04);transform:scale(1.12);animation:heroZoom 2.6s cubic-bezier(.2,.7,.2,1) forwards,heroDrift 28s ease-in-out 2.6s infinite alternate}
@keyframes heroZoom{to{transform:scale(1.02)}}
@keyframes heroDrift{from{transform:scale(1.02)}to{transform:scale(1.1) translate(-1.5%,-1%)}}
.hero .grade{position:absolute;inset:0;z-index:1;pointer-events:none;background:radial-gradient(120% 80% at 80% 15%,rgba(255,196,120,.38),rgba(255,196,120,0) 60%),linear-gradient(180deg,rgba(40,170,190,.18),rgba(40,170,190,0) 50%);mix-blend-mode:soft-light}
.hero .vig{position:absolute;inset:0;z-index:1;pointer-events:none;box-shadow:inset 0 0 220px 40px rgba(4,30,36,.45)}
@media (prefers-reduced-motion:reduce){.hero img{animation:none;transform:none}}
.hero-cta{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:20px}
.hero::after{content:"";position:absolute;inset:0;z-index:1;background:radial-gradient(75% 55% at 50% 52%,rgba(6,40,46,.62) 0%,rgba(6,40,46,.3) 60%,rgba(6,40,46,.12) 100%),linear-gradient(180deg,rgba(6,40,46,.35) 0%,rgba(6,40,46,0) 22%,rgba(6,40,46,0) 55%,rgba(6,40,46,.55) 100%)}
.hero-in{position:relative;z-index:2;width:100%;padding-bottom:clamp(40px,8vh,96px);display:grid;gap:36px;text-align:center;justify-items:center}
.hero .place{text-shadow:0 1px 12px rgba(4,30,36,.5);font-size:12px;letter-spacing:.32em;text-transform:uppercase;font-weight:600;margin-bottom:22px;display:flex;align-items:center;justify-content:center;gap:14px}
.hero .place::before{content:"";width:44px;height:1px;background:currentColor;opacity:.7}
.hero .place::after{content:"";width:44px;height:1px;background:currentColor;opacity:.7}
.hero h1{font-size:clamp(52px,9vw,116px);text-shadow:0 2px 30px rgba(4,30,36,.35);font-weight:400;line-height:1;letter-spacing:-.015em;margin-bottom:20px}
.hero h1 em{font-style:italic}
@media (max-width:640px){.hero h1 em{display:block}}
.hero .tag{font-size:clamp(17px,1.8vw,20px);line-height:1.5;max-width:460px;margin-left:auto;margin-right:auto;margin-bottom:30px;text-shadow:0 1px 16px rgba(4,30,36,.5);opacity:.95}
.hero-cta .btn{text-transform:uppercase;letter-spacing:.12em;font-size:14px;min-height:58px;padding:0 34px}
.btn .ar svg,.hbook svg{width:18px;height:18px}
.hcard{align-self:start;width:100%;max-width:340px;padding:20px 22px;border-radius:18px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);display:grid;grid-template-columns:1fr auto;gap:4px 16px;align-items:center;color:#fff;transition:background .3s}
.hcard:hover{color:#fff;background:rgba(255,255,255,.22)}
.hcard .t{font-family:var(--serif);font-size:24px;line-height:1.15;text-transform:uppercase;letter-spacing:.03em}
.hcard .s{font-family:var(--serif);font-size:22px}
.hcard .s span{font-family:var(--sans);font-size:13px;opacity:.85}
.hcard .go{grid-row:1/3;grid-column:2;width:42px;height:42px;border-radius:50%;border:1px solid rgba(255,255,255,.6);display:flex;align-items:center;justify-content:center}
.hcard .go svg{width:18px;height:18px}
.hcard .k,.hcard .ok{grid-column:1/-1;font-size:11px;letter-spacing:.16em;text-transform:uppercase;opacity:.9}
.hcard .ok{margin-top:6px;display:flex;align-items:center;gap:8px}
.hcard .ok::before{content:"";width:7px;height:7px;border-radius:50%;background:#5BD08A}
.hscroll,.hloc{display:none}
@keyframes sc{0%{opacity:0;transform:translateY(0)}40%{opacity:1}100%{opacity:0;transform:translateY(8px)}}
@media (min-width:980px){
  .hero{align-items:center;padding-top:76px}
  .hero-in{grid-template-columns:minmax(0,1fr);padding-bottom:40px;align-items:start}
  .hscroll,.hloc{position:absolute;z-index:2;bottom:28px;display:flex;align-items:center;gap:12px;font-size:11px;letter-spacing:.22em;text-transform:uppercase;opacity:.9}
  .hscroll{left:max(var(--pad),calc((100vw - var(--max))/2 + var(--pad)))}
  .hloc{right:max(var(--pad),calc((100vw - var(--max))/2 + var(--pad)))}
  .hscroll i{width:20px;height:32px;border:1.5px solid currentColor;border-radius:12px;position:relative}
  .hscroll i::after{content:"";position:absolute;left:50%;top:6px;width:2px;height:6px;margin-left:-1px;background:currentColor;border-radius:2px;animation:sc 1.8s infinite}
  .hloc svg{width:16px;height:16px}
}

/* stats */
.stats{padding:0;background:var(--white);border-bottom:1px solid var(--line)}
.stats-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
.stat{display:flex;align-items:center;gap:14px;padding:26px 8px}
.stat:nth-child(odd){border-right:1px solid var(--line);padding-left:0}
.stat:nth-child(even){padding-left:20px}
.stat:nth-child(-n+2){border-bottom:1px solid var(--line)}
.stat svg{width:46px;height:46px;padding:10px;border-radius:50%;background:var(--sand);color:var(--coral);flex:none;stroke-width:1.5}
.stat b{display:block;font-family:var(--serif);font-size:30px;font-weight:600;line-height:1}
.stat span{font-size:13px;color:var(--muted)}
@media (min-width:760px){
  .stats-grid{grid-template-columns:repeat(4,minmax(0,1fr))}
  .stat{justify-content:center;padding:34px 12px!important;border-bottom:0!important;border-right:1px solid var(--line)}
  .stat:last-child{border-right:0}
}

/* about */
.about-grid{display:grid;gap:44px;align-items:center}
.about-text p{color:var(--muted);font-size:17px;margin-bottom:18px}
.about-text p:first-of-type{color:var(--ink);font-size:19px}
.about-img{aspect-ratio:4/5;border-radius:180px 180px 8px 8px;overflow:hidden;background:var(--sand-2)}
.about-img img{width:100%;height:100%;object-fit:cover}
@media (min-width:900px){.about-grid{grid-template-columns:1.05fr .95fr;gap:90px}}

/* gallery */
.gallery{background:var(--sand)}
.ghead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:36px}
.ghead .hint{font-size:14px;color:var(--muted)}
.ggrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.gi{position:relative;overflow:hidden;border:0;padding:0;cursor:zoom-in;background:var(--sand-2);aspect-ratio:1;border-radius:14px}
.gi:first-child{grid-column:span 2;aspect-ratio:16/10}
@media (max-width:819px){.gi:last-child:nth-child(even){grid-column:span 2;aspect-ratio:16/10}}
.gi img{width:100%;height:100%;object-fit:cover;transition:transform 1s cubic-bezier(.2,.7,.2,1)}
.gi:hover img{transform:scale(1.04)}
@media (min-width:820px){
  .ggrid{grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:220px;gap:12px}
  .gi{aspect-ratio:auto}
  .gi:first-child{grid-column:span 2;grid-row:span 2;aspect-ratio:auto}
  .gi:nth-child(4){grid-row:span 2}
}

/* all-photos page */
.pg{position:fixed;inset:0;z-index:90;background:var(--white);overflow-y:auto;display:none;-webkit-overflow-scrolling:touch}
.pg.open{display:block;animation:pgIn .4s ease}
@keyframes pgIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.pg-h{position:sticky;top:0;z-index:2;background:rgba(255,252,245,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.pg-h .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;height:68px}
.pg-back{display:inline-flex;align-items:center;gap:10px;font-weight:600;font-size:14px;color:var(--ink);background:none;border:0;cursor:pointer;min-height:44px}
.pg-back svg{width:18px;height:18px;transform:rotate(180deg)}
.pg-h .btn{min-height:42px;padding:0 20px;font-size:14px}
.pg-top{padding:48px 0 28px}
.pg-top p{color:var(--muted)}
.pg-grid{columns:2;column-gap:10px}
.pg-grid button{display:block;width:100%;margin:0 0 10px;border:0;padding:0;border-radius:14px;overflow:hidden;cursor:zoom-in;background:var(--sand-2);break-inside:avoid}
.pg-grid img{width:100%;height:auto;transition:transform .8s cubic-bezier(.2,.7,.2,1)}
.pg-grid button:hover img{transform:scale(1.03)}
.pg-end{display:flex;justify-content:center;padding:40px 0 calc(64px + env(safe-area-inset-bottom))}
@media (min-width:900px){.pg-grid{columns:3;column-gap:14px}.pg-grid button{margin-bottom:14px}}

/* booking modal */
.bm{position:fixed;inset:0;z-index:95;display:none;align-items:flex-start;justify-content:center;background:rgba(6,30,36,.55);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);overflow-y:auto;padding:24px 12px}
.bm.open{display:flex;animation:pgIn .3s ease}
.bm-box{position:relative;width:100%;max-width:680px;background:var(--white);border-radius:22px;padding:28px 20px 24px;box-shadow:0 30px 80px -20px rgba(6,30,36,.5);margin:auto 0}
.bm-x{position:absolute;top:18px;right:18px;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center}
.bm-x svg{width:18px;height:18px}
.bm h2{font-family:var(--serif);font-weight:500;font-size:clamp(34px,6vw,46px);line-height:1.05;margin:0 56px 22px 0;color:var(--ocean)}
.bm-l{font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--muted);margin:0 0 10px}
.bm-rooms{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:18px}
.bm-room{text-align:left;border:1px solid var(--line);background:var(--sand);border-radius:14px;padding:14px 16px;cursor:pointer;color:var(--ink);font:inherit;transition:border-color .2s,background .2s}
.bm-room b{display:block;font-family:var(--serif);font-size:21px;font-weight:600;line-height:1.15}
.bm-room span{font-size:13px;color:var(--muted)}
.bm-room.on{border-color:var(--ocean);background:#fff;box-shadow:inset 0 0 0 1px var(--ocean)}
.bm-dates{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.bm-d{text-align:left;border:1px solid var(--line);background:#fff;border-radius:14px;padding:12px 14px;cursor:pointer;font:inherit;color:var(--ink);min-height:64px}
.bm-d small{display:block;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--muted);margin-bottom:4px}
.bm-d span{font-size:15px}
.bm-d.act{border-color:var(--ocean);box-shadow:inset 0 0 0 1px var(--ocean)}
.cal{border:1px solid var(--line);border-radius:18px;background:#fff;padding:16px 14px;margin-bottom:12px}
.cal-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.cal-h p{font-size:14px;color:var(--muted);text-align:center}
.cal-nav{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;font-size:18px;line-height:1;flex:none}
.cal-nav:disabled{opacity:.35;cursor:default}
.cal-ms{display:grid;grid-template-columns:1fr;gap:24px}
.cal-m h4{font-family:var(--serif);font-size:22px;font-weight:600;text-align:center;margin:0 0 10px;color:var(--ocean)}
.cal-g{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal-g .wd{font-size:11.5px;text-align:center;color:var(--muted);padding:4px 0}
.cal-g button{aspect-ratio:1;border:0;border-radius:8px;font:inherit;font-size:14px;font-weight:600;cursor:pointer;background:#E3F1F2;color:var(--ocean);padding:0;transition:background .15s}
.cal-g button:hover{background:#cbe6e8}
.cal-g button.past{background:transparent;color:#B9C3C4;cursor:default;font-weight:400}
.cal-g button.bk{background:#FBE1DA;color:#B4533B;cursor:not-allowed;text-decoration:line-through}
.cal-g button.rg{background:#BFDDE0}
.cal-g button.sel{background:var(--ocean);color:#fff}
.cal-leg{display:flex;flex-wrap:wrap;gap:16px;margin-top:14px;font-size:13px;color:var(--muted)}
.cal-leg span{display:flex;align-items:center;gap:7px}
.cal-leg i{width:14px;height:14px;border-radius:4px;border:1px solid rgba(0,0,0,.08)}
.bm-err{color:#B4382A;font-size:14px;margin-top:10px;min-height:0}
.bm-err:empty{display:none}
.bm-g{display:flex;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:12px 0 18px;background:#fff}
.bm-g .ctl{display:flex;align-items:center;gap:14px}
.bm-g button{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:#fff;color:var(--ink);font-size:20px;cursor:pointer}
.bm-g button:disabled{opacity:.35;cursor:default}
.bm-g b{font-family:var(--serif);font-size:26px;font-weight:600;min-width:22px;text-align:center}
.bm-f{display:grid;gap:12px;margin-bottom:16px}
.bm-f label{display:block}
.bm-f input,.bm-f textarea{width:100%;min-height:50px;border:1px solid var(--line);border-radius:12px;padding:12px 14px;font:inherit;font-size:16px;color:var(--ink);background:#fff;margin-top:6px}
.bm-f textarea{min-height:84px;resize:vertical}
.bm-f input:focus,.bm-f textarea:focus{outline:none;border-color:var(--sea);box-shadow:0 0 0 3px rgba(11,138,150,.15)}
.bm-sum{background:var(--sand);border-radius:14px;padding:14px 16px;margin-bottom:16px;display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap}
.bm-sum b{font-family:var(--serif);font-size:26px;color:var(--ocean)}
.bm-sum small{display:block;color:var(--coral);font-weight:700;font-size:13px}
.bm-act{display:grid;gap:10px}
.bm-act .btn{width:100%;justify-content:center}
@media (min-width:640px){
  .bm{padding:40px 20px}
  .bm-box{padding:40px 40px 32px}
  .cal-ms{grid-template-columns:1fr 1fr}
  .bm-f{grid-template-columns:1fr 1fr}
  .bm-f .full{grid-column:1/-1}
  .bm-act{grid-template-columns:2fr 1fr}
}
@media (max-width:639px){.cal-m + .cal-m{display:none}}

/* lightbox */
.lb{position:fixed;inset:0;z-index:100;background:rgba(12,20,22,.96);display:none;align-items:center;justify-content:center;touch-action:pan-y}
.lb.open{display:flex}
.lb img{max-width:94vw;max-height:84vh;object-fit:contain;user-select:none;-webkit-user-drag:none;transition:opacity .25s}
.lb button{position:absolute;border:0;background:rgba(255,255,255,.1);color:#fff;width:52px;height:52px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center}
.lb button:hover{background:rgba(255,255,255,.2)}
.lb button svg{width:22px;height:22px}
.lb .x{top:16px;right:16px}
.lb .prev{left:16px;top:50%;transform:translateY(-50%)}
.lb .next{right:16px;top:50%;transform:translateY(-50%)}
.lb .cnt{position:absolute;bottom:22px;left:0;right:0;text-align:center;color:rgba(255,255,255,.8);font-size:13px;letter-spacing:.12em}
@media (max-width:640px){.lb .prev,.lb .next{top:auto;bottom:10px;transform:none}.lb .cnt{bottom:26px}}

/* amenities */
.agrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:40px}
.acard{border:1px solid var(--line);border-radius:18px;padding:24px 18px;display:flex;flex-direction:column;gap:16px;background:var(--sand);transition:border-color .3s,transform .3s}
.acard:hover{border-color:var(--sea);transform:translateY(-2px)}
.acard svg{width:52px;height:52px;padding:12px;border-radius:50%;background:#fff;color:var(--sea);stroke-width:1.4}
.acard span{font-weight:500;font-size:15px;line-height:1.35}
@media (min-width:760px){.agrid{grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}.acard{padding:30px 24px}}

/* save */
.save{background:var(--sea);color:#fff}
.save .kicker{color:var(--sun)}
.save .lead{color:rgba(255,255,255,.86)}
.save-grid{display:grid;gap:40px;margin-top:44px}
.calc{background:var(--white);color:var(--ink);border-radius:22px;padding:clamp(22px,4vw,40px);box-shadow:0 30px 60px -30px rgba(0,0,0,.4)}
.nights{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-bottom:22px;border-bottom:1px solid var(--line);margin-bottom:22px}
.nights label{font-weight:600;font-size:15px}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:20px;line-height:1;display:flex;align-items:center;justify-content:center}
.stepper button:hover{border-color:var(--sea);color:var(--sea)}
.stepper output{min-width:48px;text-align:center;font-family:var(--serif);font-size:30px;font-weight:600}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:12px 0}
.row .l{font-size:15px;color:var(--muted)}
.row .v{font-family:var(--serif);font-size:28px;font-weight:600;white-space:nowrap}
.row.platform .v{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1px}
.row.direct .l{color:var(--ink);font-weight:600}
.row.direct .v{color:var(--sea);font-size:34px}
.bar{height:8px;border-radius:8px;background:var(--sand-2);overflow:hidden;margin:2px 0 6px}
.bar i{display:block;height:100%;background:var(--sea);border-radius:8px;transition:width .6s cubic-bezier(.2,.7,.2,1)}
.bar.p i{background:var(--coral)}
.saving{margin-top:22px;background:var(--sun);border-radius:14px;padding:20px 22px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.saving span{font-weight:600;font-size:15px;letter-spacing:.04em;text-transform:uppercase}
.saving span{color:var(--ocean)}
.saving b{font-family:var(--serif);font-size:clamp(40px,7vw,52px);font-weight:600;color:var(--ocean);line-height:1}
.note{font-size:12.5px;color:var(--muted);margin-top:16px;line-height:1.5}
.benefits{display:grid;gap:28px;align-content:center}
.ben{display:flex;gap:16px}
.ben .ck{flex:none;width:34px;height:34px;border-radius:50%;background:var(--sun);color:var(--ocean);display:flex;align-items:center;justify-content:center}
.ben .ck svg{width:16px;height:16px}
.ben h3{font-size:24px;margin-bottom:4px}
.ben p{color:rgba(255,255,255,.86);font-size:15px}
.save .btn{margin-top:8px;justify-self:start}
@media (min-width:900px){.save-grid{grid-template-columns:1.1fr .9fr;gap:80px}}

/* location */
.loc-grid{display:grid;gap:36px;margin-top:40px}
.map{aspect-ratio:4/3;border-radius:18px;overflow:hidden;background:var(--sand-2);border:1px solid var(--line)}
.map iframe{width:100%;height:100%;border:0}
.dist h3{font-size:28px;margin-bottom:10px}
.dist li{list-style:none;display:flex;justify-content:space-between;gap:16px;padding:16px 0;border-bottom:1px solid var(--line);font-size:16px}
.dist li b{font-weight:700;color:var(--coral);white-space:nowrap}
@media (min-width:900px){.loc-grid{grid-template-columns:1.5fr 1fr;gap:64px}.map{aspect-ratio:auto;min-height:440px}}

/* booking */
.booking{background:var(--sand)}
.bk-grid{display:grid;gap:40px}
form{background:#fff;border-radius:22px;padding:clamp(22px,4vw,40px);display:grid;gap:16px;grid-template-columns:repeat(2,minmax(0,1fr))}
.f{display:flex;flex-direction:column;gap:6px;grid-column:span 2}
.f.half{grid-column:span 1}
.f label{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.f input,.f select,.f textarea{width:100%;min-height:50px;border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--white);font-size:16px;outline:none;transition:border-color .2s}
.f textarea{min-height:96px;resize:vertical}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--sea)}
.est{grid-column:span 2;font-size:14px;color:var(--sea);font-weight:600;min-height:20px}
.err{grid-column:span 2;font-size:14px;color:#A2402E;min-height:0}
form .btn{grid-column:span 2;width:100%}
.alt{display:flex;flex-direction:column;gap:16px}
.alt p{font-size:14px;color:var(--muted)}
.alt-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.alt-btns .btn{width:100%;padding:0 16px}
.contact-list{margin-top:8px;display:grid;gap:6px;font-size:15px}
.bk-grid form{display:none}
.bk-grid{max-width:560px}
.bk-m{display:inline-flex;width:100%;min-height:56px;margin-top:6px}

/* reviews */
.rv-ph{margin-top:40px;border:1.5px dashed #E3B979;border-radius:22px;padding:clamp(28px,5vw,48px);text-align:center;background:repeating-linear-gradient(135deg,transparent 0 14px,rgba(233,223,207,.35) 14px 15px)}
.rv-ph .tag{display:inline-block;font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:#8A7550;border:1px solid #C9B999;border-radius:999px;padding:5px 12px;margin-bottom:14px}
.rv-ph p{max-width:520px;margin:0 auto;color:var(--muted);font-size:15px}
.rgrid{display:grid;gap:16px;margin-top:40px}
.rcard{border:1px solid var(--line);border-radius:18px;padding:28px;background:#fff}
.stars{color:var(--sun);letter-spacing:3px;margin-bottom:12px}
.rcard p{font-family:var(--serif);font-size:21px;line-height:1.45;margin-bottom:18px}
.rcard .who{font-size:14px;color:var(--muted)}
.rcard .who b{color:var(--ink)}
@media (min-width:820px){.rgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}

/* footer */
footer{background:var(--ocean);color:rgba(255,255,255,.78);padding:0 0 calc(28px + env(safe-area-inset-bottom));position:relative;overflow:hidden}
footer a{color:#fff;transition:color .2s}
footer a:hover{color:var(--sun)}
.fcta{position:relative;padding:72px 0 56px;border-bottom:1px solid rgba(255,255,255,.12);display:grid;gap:28px;align-items:end}
.fcta h3{font-family:var(--serif);font-weight:400;font-size:clamp(44px,8vw,92px);line-height:1;color:#fff;letter-spacing:-.01em}
.fcta h3 em{font-style:italic;color:var(--sun)}
.fcta p{margin-top:14px;max-width:420px;font-size:16px}
.fcta .btn{justify-self:start}
footer .logo{color:#fff;font-size:30px}
.fgrid{display:grid;gap:36px;padding:48px 0 8px}
footer h4{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--sun);margin-bottom:16px;font-weight:700}
.fc{display:flex;align-items:center;gap:12px;font-size:15px;margin-bottom:12px}
.fc .ic{width:38px;height:38px;border-radius:50%;border:1px solid rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;flex:none;color:var(--sun)}
.fc .ic svg{width:17px;height:17px}
.flinks{display:grid;gap:10px;font-size:15px}
.flinks a{color:rgba(255,255,255,.85)}
.fbottom{margin-top:40px;padding-top:22px;border-top:1px solid rgba(255,255,255,.12);display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;font-size:13px;color:rgba(255,255,255,.6)}
.fbottom [data-c="credit"]{color:rgba(255,255,255,.85)}
@media (min-width:820px){
  .fcta{grid-template-columns:1fr auto;padding:96px 0 64px}
  .fcta .btn{justify-self:end}
  .fgrid{grid-template-columns:1.3fr 1fr 1fr 1fr;gap:40px;padding-top:56px}
}

$('#ggrid').innerHTML = C.images.gallery.slice(0, C.galleryPreview || 7).map((src,i) => `<button class="gi rv" data-idx="${i}" aria-label="Photo ${i+1}"><img src="${esc(src)}" alt="" loading="lazy"></button>`).join('');

function render(){
  document.documentElement.lang = lang;
  document.title = `${C.name} — ${C.place}, ${tr(C.country)}`;
  $$('[data-t]').forEach(el => el.textContent = T(el.dataset.t));
  $('#lang').innerHTML = Object.keys(STRINGS).map(l => `<button type="button" class="${l===lang?'on':''}" data-l="${l}">${l.toUpperCase()}</button>`).join('');
  const placeStr = `${C.place}, ${tr(C.country)}`;
  $('#heroPlace').textContent = placeStr; $('#locPlace').textContent = placeStr; $('#footPlace').textContent = placeStr; $('#hFacts').innerHTML = `<div><b>${C.guests}</b><span>${esc(T('guests'))}</span></div><div><b>${esc(C.beachDistance)}</b><span>${esc(T('hBeach'))}</span></div><div><b>${esc(money(C.priceFrom))}</b><span>${esc(T('from'))} ${esc(T('perNight'))}</span></div>`; $('#footHead').innerHTML = esc(T('footHead1')) + ' <em>' + esc(C.place) + '.</em>'; $('#fDir').href = 'https://www.google.com/maps/dir/?api=1&destination=' + C.map.lat + ',' + C.map.lng;
  $('#heroTag').textContent = tr(C.tagline);
  $('#gAllT').textContent = `${T('viewAllBtn')} (${C.images.gallery.length})`;
  $('#pgCount').textContent = `${C.images.gallery.length} ${T('photosWord')}`;
  const nw = C.name.split(' '); $('#heroTitle').innerHTML = nw.length > 1 ? esc(nw.slice(0,-1).join(' ')) + ' <em>' + esc(nw[nw.length-1]) + '.</em>' : esc(C.name);
  $('#hLoc').textContent = placeStr;
  $('#stats').innerHTML = [
    ['guests', C.guests, T('guests')], ['bed', C.bedrooms, T('bedrooms')],
    ['bath', C.bathrooms, T('bathrooms')], ['beach', C.beachDistance, T('toBeach')]
  ].map(([i,v,l]) => `<div class="stat rv">${ICONS[i]}<div><b>${esc(v)}</b><span>${esc(l)}</span></div></div>`).join('');
  $('#aboutText').innerHTML = tr(C.about).map(p => `<p>${esc(p)}</p>`).join('');
  $('#agrid').innerHTML = C.amenities.map(a => `<div class="acard rv">${ICONS[a.icon]||ICONS.check}<span>${esc(tr(a.label))}</span></div>`).join('');
  $('#dist').innerHTML = C.distances.map(x => `<li><span>${esc(tr(x.label))}</span><b>${esc(x.value)}</b></li>`).join('');
  $('#fM').placeholder = T('msgPh');
  calc(); estimate(); if (window.renderBk) renderBk(); if (window.observeRv) observeRv();
}
function renderMarq(){
  const words = C.amenities.map(a => tr(a.label));
  const run = words.map(w => '<span>' + esc(w) + '</span><i></i>').join('');
  $('#marq').innerHTML = run + run + run + run;
}
function splitAll(){
  $$('#heroTitle, #heroTag, .h2, .ben h3, .dist h3').forEach(el => {
    if (el.closest('.pg')) return;
    let n = 0;
    const walk = node => [...node.childNodes].forEach(c => {
      if (c.nodeType === 3) {
        const frag = document.createDocumentFragment();
        c.textContent.split(/(\s+)/).forEach(w => {
          if (!w) return;
          if (/^\s+$/.test(w)) { frag.appendChild(document.createTextNode(' ')); return; }
          const o = document.createElement('span'); o.className = 'sw';
          const i = document.createElement('span'); i.textContent = w; i.style.transitionDelay = (n++ * 70 + (el.id === 'heroTitle' ? 300 : el.id === 'heroTag' ? 700 : 0)) + 'ms';
          o.appendChild(i); frag.appendChild(o);
        });
        c.replaceWith(frag);
      } else if (c.nodeType === 1 && !c.classList.contains('sw')) walk(c);
    });
    walk(el);
    el.classList.add('rv', 'split');
    if (!el.closest('.hero')) el.classList.add('scrub');
  });
  $$('.about-text p').forEach(p => {
    p.innerHTML = p.textContent.split(/\s+/).map(w => '<span class="fw">' + esc(w) + '</span>').join(' ');
    p.classList.add('rv', 'split', 'fwp');
  });
  $$('.rv-img').forEach(el => el.classList.add('scrubbed'));
}
const clamp01 = v => v < 0 ? 0 : v > 1 ? 1 : v;
function scrub(){
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const vh = window.innerHeight;
  $$('.scrub').forEach(el => {
    const r = el.getBoundingClientRect(); if (r.bottom < -100 || r.top > vh + 100) return;
    const p = clamp01((vh * .98 - r.top) / (vh * .42));
    const ws = el.querySelectorAll('.sw > span'), n = ws.length;
    ws.forEach((s, i) => { const k = 1 - clamp01(p * (n * .6 + 1.5) - i * .6); s.style.transitionDelay = '0ms'; s.style.transform = 'translateY(' + (k * 110) + '%) rotate(' + (k * 5) + 'deg)'; });
  });
  $$('.fwp').forEach(el => {
    const r = el.getBoundingClientRect(); if (r.bottom < -100 || r.top > vh + 100) return;
    const p = clamp01((vh * .9 - r.top) / (r.height + vh * .3));
    const ws = el.querySelectorAll('.fw'), n = ws.length;
    ws.forEach((s, i) => { s.style.opacity = .16 + .84 * clamp01(p * n * 1.15 - i); });
  });
  $$('.rv-img').forEach(el => {
    const r = el.getBoundingClientRect(); if (r.bottom < -100 || r.top > vh + 100) return;
    const p = clamp01((vh - r.top) / (vh * .75)), k = 1 - p;
    const round = el.classList.contains('about-img') ? '180px 180px 8px 8px' : '18px';
    el.style.clipPath = 'inset(' + (k * 22) + '% ' + (k * 8) + '% 0 ' + (k * 8) + '% round ' + round + ')';
    const img = el.querySelector('img'); if (img) img.style.transform = 'scale(' + (1 + k * .25) + ')';
  });
  $$('.gi').forEach(el => {
    const r = el.getBoundingClientRect(); if (r.bottom < -100 || r.top > vh + 100) return;
    const p = clamp01((vh - r.top) / (vh * .6));
    el.style.transform = 'translateY(' + ((1 - p) * 60) + 'px) scale(' + (.9 + p * .1) + ')';
    el.style.opacity = .2 + p * .8;
  });
}

function renderReviews(){
  const R = C.reviews || [];
  const link = C.googleReviewsUrl ? `<p style="margin-top:28px"><a href="${esc(C.googleReviewsUrl)}" target="_blank" rel="noopener">${T('revAll')} →</a></p>` : '';
  if (!R.length) { $('#revWrap').innerHTML = `<div class="rv-ph"><span class="tag">${T('revPhTitle')}</span><p>${T('revPh')}</p></div>${link}`; return; }
  $('#revWrap').innerHTML = `<div class="rgrid">${R.map(r => `<div class="rcard"><div class="stars">${'★'.repeat(r.rating||5)}</div><p>“${esc(r.text)}”</p><div class="who"><b>${esc(r.name)}</b>${r.country?' · '+esc(r.country):''}${r.date?' · '+esc(r.date):''}</div></div>`).join('')}</div>${link}`;
}

function calc(){
  const base = C.priceFrom * nights, plat = base * (1 + C.platformCommission);
  $('#nVal').textContent = nights;
  $('#pPlat').textContent = money(plat);
  $('#pDir').textContent = money(base);
  $('#pSave').textContent = money(plat - base);
  $('#barD').style.width = (100 / (1 + C.platformCommission)) + '%';
  $('#saveNote').textContent = T('saveNote', { price: money(C.priceFrom), pct: Math.round(C.platformCommission*100) });
}
$('#nMinus').onclick = () => { nights = Math.max(1, nights-1); calc(); };
$('#nPlus').onclick = () => { nights = Math.min(30, nights+1); calc(); };

$('#lang').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; lang = b.dataset.l; localStorage.setItem('villaLang', lang); render(); });

// booking form
const nightsBetween = () => { const a = $('#fIn').value, b = $('#fOut').value; if (!a||!b) return 0; return Math.round((new Date(b) - new Date(a)) / 864e5); };
function estimate(){ const n = nightsBetween(); $('#est').textContent = n > 0 ? T('estimate', { n, total: money(n * C.priceFrom) }) : ''; }
$('#fIn').addEventListener('change', () => {
  if ($('#fIn').value) { const nx = new Date($('#fIn').value); nx.setDate(nx.getDate()+1); const v = nx.toISOString().slice(0,10); $('#fOut').min = v; if (!$('#fOut').value || $('#fOut').value < v) { const w = new Date($('#fIn').value); w.setDate(w.getDate()+7); $('#fOut').value = w.toISOString().slice(0,10); } }
  $('#err').textContent=''; estimate();
});
$('#fOut').addEventListener('change', () => { $('#err').textContent=''; estimate(); });
const fmtDate = v => new Date(v + 'T12:00').toLocaleDateString(LOCALE[lang], { day:'numeric', month:'long', year:'numeric' });
$('#form').addEventListener('submit', e => {
  e.preventDefault();
  const name = $('#fN').value.trim();
  if (nightsBetween() <= 0) { $('#err').textContent = T('errDates'); return; }
  if (!name) { $('#err').textContent = T('errName'); $('#fN').focus(); return; }
  $('#err').textContent = '';
  const msg = $('#fM').value.trim();
  const text = [
    T('waIntro', { villa: C.name }), '',
    `${T('waArrival')}: ${fmtDate($('#fIn').value)}`,
    `${T('waDeparture')}: ${fmtDate($('#fOut').value)} (${nightsBetween()} ${T('nights').toLowerCase()})`,
    `${T('waGuests')}: ${$('#fG').value}`,
    `${T('waName')}: ${name}`,
    msg ? `${T('waMsg')}: ${msg}` : ''
  ].filter((l,i) => l || i===1).join('\n');
  window.open(wa(text), '_blank', 'noopener');
});

// lightbox
const G = C.images.gallery; let cur = 0;
const lb = $('#lb'), lbImg = $('#lbImg');
const show = i => { cur = (i + G.length) % G.length; lbImg.style.opacity = 0; lbImg.onload = () => lbImg.style.opacity = 1; lbImg.src = G[cur]; $('#lbC').textContent = `${cur+1} / ${G.length}`; };
const open = i => { show(i); lb.classList.add('open'); document.body.style.overflow = 'hidden'; };
const close = () => { lb.classList.remove('open'); document.body.style.overflow = $('#photos').classList.contains('open') ? 'hidden' : ''; };
$('#ggrid').addEventListener('click', e => { const b = e.target.closest('.gi'); if (b) open(+b.dataset.idx); });
$('#pgGrid').innerHTML = G.map((src,i) => '<button data-idx="'+i+'" aria-label="Photo '+(i+1)+'"><img src="'+esc(src)+'" alt="" loading="lazy"></button>').join('');
$('#pgGrid').addEventListener('click', e => { const b = e.target.closest('button'); if (b) open(+b.dataset.idx); });
const route = () => { const on = location.hash === '#photos'; $('#photos').classList.toggle('open', on); document.body.style.overflow = on ? 'hidden' : ''; if (on) $('#photos').scrollTop = 0; };
window.addEventListener('hashchange', route); route();
$('#lbX').onclick = close; $('#lbP').onclick = () => show(cur-1); $('#lbN').onclick = () => show(cur+1);
lb.addEventListener('click', e => { if (e.target === lb) close(); });
document.addEventListener('keydown', e => { if (!lb.classList.contains('open')) return; if (e.key==='Escape') close(); if (e.key==='ArrowLeft') show(cur-1); if (e.key==='ArrowRight') show(cur+1); });
let tx = 0, ty = 0;
lb.addEventListener('touchstart', e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, { passive:true });
lb.addEventListener('touchend', e => { const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty; if (Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy)) show(cur + (dx < 0 ? 1 : -1)); else if (dy > 90) close(); });

// header + fab on scroll
const hdr = $('#hdr'), fab = $('#fab');
const prog = $('#prog'), hin = $('.hero-in'), still = matchMedia('(prefers-reduced-motion: reduce)').matches;
let ticking = false;
const onScroll = () => { if (ticking) return; ticking = true; requestAnimationFrame(() => { ticking = false;
  const y = window.scrollY, vh = window.innerHeight, max = document.documentElement.scrollHeight - vh;
  hdr.classList.toggle('solid', y > 40); fab.classList.toggle('show', y > vh * .5);
  prog.style.transform = 'scaleX(' + (max > 0 ? y / max : 0) + ')';
}); };
window.addEventListener('scroll', onScroll, { passive:true });
window.addEventListener('resize', onScroll);

render(); onScroll();

// mobile menu + active nav link
const mnav = $('#mnav');
const setMenu = on => { mnav.classList.toggle('open', on); hdr.classList.toggle('mopen', on); document.body.style.overflow = on ? 'hidden' : ''; [...mnav.querySelectorAll('a')].forEach((a,i) => a.style.transitionDelay = on ? (80 + i*50) + 'ms' : '0ms'); };
$('#menuBtn').onclick = () => setMenu(!mnav.classList.contains('open'));
mnav.addEventListener('click', e => { if (e.target.closest('a')) setMenu(false); });
if ('IntersectionObserver' in window) {
  const navIo = new IntersectionObserver(es => es.forEach(en => { if (en.isIntersecting) $$('nav.links a').forEach(a => a.classList.toggle('act', a.getAttribute('href') === '#' + en.target.id)); }), { rootMargin:'-45% 0px -50% 0px' });
  ['about','gallery','amenities','save','location','book','top'].forEach(id => { const s = document.getElementById(id); if (s) navIo.observe(s); });
}

// reveal on scroll
const countUp = b => { const m = b.textContent.match(/^(\d+)(.*)$/); if (!m || still) return; const end = +m[1], suf = m[2], t0 = performance.now(), d = 1200;
  const step = t => { const p = Math.min(1, (t - t0) / d), e = 1 - Math.pow(1 - p, 3); b.textContent = Math.round(end * e) + suf; if (p < 1) requestAnimationFrame(step); }; requestAnimationFrame(step); };
const io = 'IntersectionObserver' in window ? new IntersectionObserver(es => es.forEach(en => { const el = en.target; el.classList.toggle('in', en.isIntersecting); }), { threshold:0, rootMargin:'-6% 0px -10% 0px' }) : null;
const stagger = el => { const sib = [...el.parentElement.children].filter(c => c.classList.contains('rv')); return sib.length > 1 ? (sib.indexOf(el) % 4) * 90 : 0; };
const autoTag = () => $$('main, section:not(.hero) .kicker, section:not(.hero) .h2, section:not(.hero) .lead, section:not(.hero) .btn, .about-text p, .dist li, footer .fgrid > div').forEach(el => { if (!el.closest('.rv') && !el.closest('.pg')) el.classList.add('rv'); });
window.observeRv = () => { autoTag(); return _obs(); };
const _obs = () => $$('.rv:not(.in)').forEach(el => { if (io) { io.observe(el); } else el.classList.add('in'); });
observeRv();

// booking modal
(() => {
  const bm = $('#bm'), rooms = C.rooms && C.rooms.length ? C.rooms : [{ name:C.unitName || C.name, guests:C.guests, price:C.priceFrom }];
  const today = new Date(); today.setHours(0,0,0,0);
  const iso = d => d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  const S = { r:0, a:null, b:null, g:2, m:new Date(today.getFullYear(), today.getMonth(), 1), err:'' };
  const booked = d => { const s = iso(d); return (C.bookedDates || []).some(([x,y]) => s >= x && s < y); };
  const fmt = d => d ? d.toLocaleDateString(LOCALE[lang], { weekday:'short', day:'numeric', month:'short' }) : T('bkAdd');
  const nights = () => S.a && S.b ? Math.round((S.b - S.a) / 864e5) : 0;
  function month(base){
    const y = base.getFullYear(), m = base.getMonth(), first = (new Date(y,m,1).getDay() + 6) % 7, days = new Date(y,m+1,0).getDate();
    const wd = [...Array(7)].map((_,i) => '<span class="wd">' + new Date(2024,0,1+i).toLocaleDateString(LOCALE[lang], { weekday:'short' }) + '</span>').join('');
    let cells = '<span></span>'.repeat(first);
    for (let d = 1; d <= days; d++) {
      const dt = new Date(y,m,d), t = +dt; let c = '';
      if (dt < today) c = 'past'; else if (booked(dt)) c = 'bk';
      if (S.a && t === +S.a || S.b && t === +S.b) c = 'sel'; else if (S.a && S.b && t > S.a && t < S.b) c = 'rg';
      cells += '<button type="button" class="' + c + '" data-d="' + iso(dt) + '"' + (c === 'past' || c === 'bk' ? ' disabled' : '') + '>' + d + '</button>';
    }
    const title = base.toLocaleDateString(LOCALE[lang], { month:'long', year:'numeric' });
    return '<div class="cal-m"><h4>' + title.charAt(0).toUpperCase() + title.slice(1) + '</h4><div class="cal-g">' + wd + cells + '</div></div>';
  }
  function render(){
    const R = rooms[S.r]; if (S.g > R.guests) S.g = R.guests;
    $('#bmRooms').innerHTML = rooms.map((r,i) => '<button type="button" class="bm-room' + (i === S.r ? ' on' : '') + '" data-r="' + i + '"><b>' + esc(tr(r.name)) + '</b><span>' + T('bkUpTo', { n:r.guests }) + ' · ' + money(r.price) + ' ' + T('perNight') + '</span></button>').join('');
    $('#bmIn span').textContent = fmt(S.a); $('#bmOut span').textContent = fmt(S.b);
    $('#bmIn').classList.toggle('act', !S.a || !!S.b); $('#bmOut').classList.toggle('act', !!S.a && !S.b);
    $('#calHint').textContent = S.a && !S.b ? T('bkPickOut') : T('bkPickIn');
    $('#calMs').innerHTML = month(S.m) + month(new Date(S.m.getFullYear(), S.m.getMonth()+1, 1));
    $('#calPrev').disabled = S.m <= new Date(today.getFullYear(), today.getMonth(), 1);
    $('#bmErr').textContent = S.err;
    $('#gNum').textContent = S.g; $('#gMinus').disabled = S.g <= 1; $('#gPlus').disabled = S.g >= R.guests;
    const n = nights();
    if (n) { const tot = n * R.price, plat = tot * (1 + C.platformCommission); $('#bmSum').innerHTML = '<span>' + T('bkNights', { n }) + ' · ' + esc(tr(R.name)) + '</span><b>' + money(tot) + '</b><small>' + T('bkSave', { s:money(plat - tot) }) + '</small>'; $('#bmSum').style.display = ''; }
    else $('#bmSum').style.display = 'none';
  }
  bm.addEventListener('click', e => {
    if (e.target === bm) return close();
    const r = e.target.closest('[data-r]'); if (r) { S.r = +r.dataset.r; render(); return; }
    const b = e.target.closest('.cal-g button[data-d]'); if (!b || b.disabled) return;
    const [y,m,d] = b.dataset.d.split('-').map(Number), dt = new Date(y,m-1,d); S.err = '';
    if (!S.a || S.b || dt <= S.a) { S.a = dt; S.b = null; }
    else { let bad = false; for (let x = new Date(S.a); x < dt; x.setDate(x.getDate()+1)) if (booked(x)) bad = true;
      if (bad) S.err = T('bkErrBooked'); else S.b = dt; }
    render();
  });
  $('#bmIn').onclick = () => { S.a = null; S.b = null; S.err = ''; render(); };
  $('#bmOut').onclick = () => { if (S.a) { S.b = null; render(); } };
  $('#calPrev').onclick = () => { S.m = new Date(S.m.getFullYear(), S.m.getMonth()-1, 1); render(); };
  $('#calNext').onclick = () => { S.m = new Date(S.m.getFullYear(), S.m.getMonth()+1, 1); render(); };
  $('#gMinus').onclick = () => { S.g--; render(); };
  $('#gPlus').onclick = () => { S.g++; render(); };
  const text = () => { const R = rooms[S.r], msg = $('#bmMsg').value.trim(), n = nights();
    return [T('waIntro', { villa:C.name }), '', T('bkRoom') + ': ' + tr(R.name), T('waArrival') + ': ' + fmt(S.a), T('waDeparture') + ': ' + fmt(S.b) + ' (' + T('bkNights', { n }) + ')', T('waGuests') + ': ' + S.g, T('waName') + ': ' + $('#bmName').value.trim(), $('#bmMail').value.trim() ? 'Email: ' + $('#bmMail').value.trim() : '', msg ? T('waMsg') + ': ' + msg : ''].filter(Boolean).join('\n'); };
  const ok = () => { const e2 = $('#bmErr2'); e2.textContent = !S.a || !S.b ? T('bkNeedDates') : !$('#bmName').value.trim() ? T('errName') : ''; return !e2.textContent; };
  $('#bmWa').onclick = () => { if (ok()) window.open(wa(text()), '_blank', 'noopener'); };
  $('#bmEm').onclick = () => { if (ok()) location.href = 'mailto:' + C.email + '?subject=' + encodeURIComponent(T('bkTitle') + ' — ' + C.name) + '&body=' + encodeURIComponent(text()); };
  const open = () => { render(); bm.classList.add('open'); bm.scrollTop = 0; document.body.style.overflow = 'hidden'; };
  const close = () => { bm.classList.remove('open'); document.body.style.overflow = ''; };
  $('#bmX').onclick = close;
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && bm.classList.contains('open')) close(); });
  document.addEventListener('click', e => { const a = e.target.closest('a[href="#book"], a.wa-float'); if (!a || a.classList.contains('wa-float')) return; e.preventDefault(); if (location.hash === '#photos') history.replaceState(null, '', location.pathname); window.dispatchEvent(new Event('hashchange')); open(); }, true);
  window.renderBk = render;
})();
})();
</script>
